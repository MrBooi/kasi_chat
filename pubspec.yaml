name: kasi_chat
description: A Very Good Project created by Very Good CLI.
version: 1.0.0+1
publish_to: none

environment:
  sdk: '>=3.11.0 <4.0.0'
  # flutter: ^3.35.0

dependencies:
  flutter:
    sdk: flutter
 
  #state management
  bloc: ^9.2.1
  flutter_bloc: ^9.1.1
  get_it: ^9.2.1


  #database
  drift: ^2.34.0
  drift_flutter: ^0.3.0
  sqlite3_flutter_libs: ^0.6.0+eol

  #router
  go_router: ^17.3.0

  #localization
  intl: ^0.20.2
  flutter_localizations:
    sdk: flutter

  #supabase
  supabase_flutter: ^2.15.0

  #utilities
  equatable: ^2.0.8
  logger: ^2.7.0
  flex_color_scheme: ^8.4.0
  image_picker: 1.2.2
  path_provider: ^2.1.6
  path: 1.9.1
  uuid: ^4.5.3
  mime: ^2.0.0
  formz: ^0.8.0


dev_dependencies:
  bloc_test: ^10.0.0
  build_runner: 2.15.0
  drift_dev: ^2.34.0
  flutter_test:
    sdk: flutter
  mocktail: ^1.0.5
  very_good_analysis: ^10.3.0

flutter:
  generate: true
  uses-material-design: true

  fonts:
      - family: icomoon
        fonts:
          - asset: fonts/icomoon.ttf